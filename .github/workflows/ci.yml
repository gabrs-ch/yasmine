name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Não há o que cachear entre steps de debug info num CI que só valida.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # ALSA (cpal) e X11/GL (eframe) entram quando as Fases 1 e 2 chegarem.
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libgl1-mesa-dev

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace
