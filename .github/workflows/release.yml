name: Release

# Dispara em tag `v*` (ex. v0.5.0) — cada tag vira uma versão baixável.
# O CI comum (ci.yml) garante que builda e passa nos testes a cada push;
# este workflow empacota AppImage/.deb (Linux) e o setup NSIS (Windows).
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libssl-dev

      - name: tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Instala o frontend
        working-directory: crates/pc-app/ui
        run: npm ci

      # `cargo tauri build` roda o beforeBuildCommand (npm run build) e
      # empacota. No Linux o AppImage sai auto-contido (o próprio bundler
      # copia o WebKitGTK pra dentro). No Windows o WebView2 é baixado na
      # instalação se faltar (Win11 já tem).
      - name: Empacota
        working-directory: crates/pc-app
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Coleta os pacotes
        shell: bash
        run: |
          mkdir dist
          find target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*-setup.exe' \) \
            -exec cp {} dist/ \;
          # Windows: além do instalador NSIS, um .zip portátil com o .exe
          # cru — extrair e rodar, sem instalar (usa o WebView2 do sistema).
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/Yasmine_${GITHUB_REF_NAME#v}_windows_portable.zip" \
              ./target/release/yasmine.exe
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: yasmine-${{ runner.os }}
          path: dist/*

  release:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publica a release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
