name: Release

# Dispara em tag `v*` (ex. v0.5.2). O CI comum (ci.yml) já garante que builda
# e passa nos testes; este workflow empacota AppImage/.deb/.rpm (Linux) e o
# setup NSIS (Windows) e publica na release da tag.
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ". -> target"
      # binário pronto do cargo-tauri — não compila os ~200 crates do CLI.
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libssl-dev

      - name: Instala o frontend
        working-directory: crates/pc-app/ui
        run: npm ci

      - name: Empacota
        working-directory: crates/pc-app
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Coleta os pacotes
        shell: bash
        run: |
          mkdir dist
          find target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' \) \
            -exec cp {} dist/ \;
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/Yasmine_${GITHUB_REF_NAME#v}_windows_portable.zip" ./target/release/yasmine.exe
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: yasmine-${{ runner.os }}
          path: dist/*
          if-no-files-found: warn

  release:
    needs: bundle
    # Publica o que subiu mesmo se um dos jobs de bundle falhar (ex. Windows).
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -R artifacts || true
      - name: Publica a release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
