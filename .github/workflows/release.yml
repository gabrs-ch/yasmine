name: Release

# Dispara em tag `v*` (ex. v0.1.0) — cada tag vira uma versão baixável pra
# quem só quer usar o player, sem compilar nada. O CI comum (ci.yml) já
# garante que o código builda e passa nos testes a cada push; este workflow
# só entra quando alguém decide que aquele estado é uma versão de verdade.
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: yasmine-linux-x86_64.tar.gz
          - os: windows-latest
            asset: yasmine-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release -p player-pc

      # Cada pacote já sai pronto pra abrir — binário na raiz do arquivo, sem
      # precisar procurar dentro de uma pasta — e com o que a instalação de
      # verdade (não só "rodar uma vez") precisa: no Linux, o `.desktop` e o
      # ícone que `install.sh` registra; no Windows, o script que associa a
      # extensões de áudio.
      - name: Empacotar (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp target/release/yasmine dist/
          cp crates/pc-app/assets/icon-256.png dist/
          cp packaging/linux/yasmine.desktop dist/
          cp packaging/linux/install.sh dist/
          cp README.md dist/
          tar -czf ${{ matrix.asset }} -C dist .

      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item target/release/yasmine.exe dist/
          Copy-Item packaging/windows/register-file-types.ps1 dist/
          Copy-Item packaging/windows/register-file-types.cmd dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
