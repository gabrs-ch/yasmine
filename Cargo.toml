[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/audio",
    "crates/sync",
    "crates/sync-host",
    "crates/pc-app",
    "crates/android-ffi",
    "tools/libgen",
]

[workspace.package]
version = "0.5.7"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
player-core = { path = "crates/core" }
player-audio = { path = "crates/audio" }
yasmine-sync = { path = "crates/sync" }

blake3 = "1"
cpal = "0.16"
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jwalk = "0.8"
lofty = "0.22"
notify = "8"
rayon = "1"
rtrb = "0.3"
rusqlite = { version = "0.37", features = ["bundled", "blob", "backup", "array"] }
symphonia = { version = "0.5", features = ["all"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7"] }

# Sync na LAN (crates/sync, sync-host, android-ffi). `snow` no resolver
# RustCrypto puro (sem `ring`): cross-compila pro NDK sem toolchain C.
# Padrão Noise_IK_25519_ChaChaPoly_BLAKE2s.
snow = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
getrandom = "0.2"
mdns-sd = "0.11"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
data-encoding = "2"
form_urlencoded = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Alocação e cópia escondidas: o que mais custa num hot loop de scan/render.
needless_pass_by_value = "warn"
redundant_clone = "warn"
inefficient_to_string = "warn"
large_types_passed_by_value = "warn"
# `unwrap` some em release e vira crash silencioso pro usuário.
unwrap_used = "warn"

# Release: otimizado pra binário pequeno e start rápido.
# LTO fat + 1 codegen unit custa tempo de build, não de execução.
# Release: otimizado, mas `lto = "thin"` em vez de `fat` — com o webview no
# meio, o gargalo de start/tamanho é o WebKitGTK, não o binário Rust, e o
# `fat` fazia o link do `player-pc` (todo o Tauri/wry junto) levar dezenas de
# minutos no CI de 2 núcleos. `thin` pega ~95% do ganho a uma fração do tempo.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Debug: as dependências (symphonia, blake3, sqlite) rodam otimizadas mesmo em
# build de debug — sem isso, decodificar áudio e hashear ficam inutilizáveis.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
